name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarize:
        description: 'Skip macOS notarization'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==================== Check Branch Reachability ====================
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag is on the default branch
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Manual trigger: Proceeding with build."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check version consistency for tag triggers
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION=$(node -p "require('fs').readFileSync('backend/src/XIVTheCalamity/XIVTheCalamity.csproj', 'utf8').match(/<Version>(.*?)<\/Version>/)[1]")
            EXPECTED_TAG="v${VERSION}"
            echo "Triggered Tag: $TAG_NAME"
            echo "Version in csproj: $VERSION (Expected Tag: $EXPECTED_TAG)"
            
            if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
              echo "❌ ERROR: Triggered tag ($TAG_NAME) does not match version in csproj ($EXPECTED_TAG)!"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            echo "✅ Version consistency check passed."
          fi
          
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          echo "Default branch is: $DEFAULT_BRANCH"
          git fetch origin "$DEFAULT_BRANCH"
          
          if git merge-base --is-ancestor ${{ github.sha }} "origin/$DEFAULT_BRANCH"; then
            echo "✅ Tag is on default branch ($DEFAULT_BRANCH). Proceeding with build."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ==================== macOS ====================
  build-macos:
    needs: check-branch
    if: needs.check-branch.outputs.should_run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build XTCAudioRouter
      - name: Build XTCAudioRouter
        run: |
          mkdir -p shared/resources/bin
          swiftc XTCAudioRouter/AudioRouter.swift -framework CoreAudio -framework AudioToolbox -o shared/resources/bin/XTCAudioRouter

      # Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build:renderer
          mkdir -p ../backend/src/XIVTheCalamity/wwwroot
          cp -R dist/* ../backend/src/XIVTheCalamity/wwwroot/

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity/XIVTheCalamity.csproj \
            -c Release -r osx-arm64 --self-contained true /p:PublishAot=true \
            -o ../Release/mac-out

      # Import signing certificate
      - name: Import certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$CERT_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"Developer ID Application: \(.*\)".*/\1/')
          echo "CSC_NAME=$IDENTITY" >> $GITHUB_ENV
          echo "Signing identity: $IDENTITY"

      # Prepare Apple API Key for notarization
      - name: Prepare notarization key
        if: ${{ !inputs.skip_notarize }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV

      # Package App Bundle
      - name: Package App Bundle
        run: |
          APP_DIR="Release/mac-arm64/XIVTheCalamity.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources/resources"
          
          cp Release/mac-out/XIVTheCalamity "$APP_DIR/Contents/MacOS/XIVTheCalamity"
          cp Release/mac-out/*.dylib "$APP_DIR/Contents/MacOS/" 2>/dev/null || true
          
          # Get version from csproj
          VERSION=$(node -p "require('fs').readFileSync('backend/src/XIVTheCalamity/XIVTheCalamity.csproj', 'utf8').match(/<Version>(.*?)<\/Version>/)[1]")
          
          # Copy Info.plist from repository and dynamically patch versions using plutil
          cp backend/src/XIVTheCalamity/Info.plist "$APP_DIR/Contents/Info.plist"
          plutil -replace CFShortVersionString -string "$VERSION" "$APP_DIR/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP_DIR/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP_DIR/Contents/Info.plist"
          
          cp frontend/build/XIVTC.icns "$APP_DIR/Contents/Resources/"
          cp -R shared/resources/ "$APP_DIR/Contents/Resources/resources/"

      # Codesign App Bundle
      - name: Codesign App Bundle
        run: |
          IDENTITY="${{ env.CSC_NAME }}"
          if [ -n "$IDENTITY" ]; then
            echo "Signing with identity: $IDENTITY"
            find "Release/mac-arm64/XIVTheCalamity.app/Contents/MacOS" -name "*.dylib" -exec codesign --force --options runtime --sign "Developer ID Application: $IDENTITY" {} \;
            codesign --force --options runtime --sign "Developer ID Application: $IDENTITY" "Release/mac-arm64/XIVTheCalamity.app/Contents/Resources/resources/bin/XTCAudioRouter"
            codesign --force --options runtime --sign "Developer ID Application: $IDENTITY" "Release/mac-arm64/XIVTheCalamity.app/Contents/MacOS/XIVTheCalamity"
            codesign --force --options runtime --sign "Developer ID Application: $IDENTITY" "Release/mac-arm64/XIVTheCalamity.app"
          else
            echo "Signing identity not found, skipping codesign."
          fi

      # Package DMG and Notarize
      - name: Package DMG and Notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          VERSION=$(node -p "require('fs').readFileSync('backend/src/XIVTheCalamity/XIVTheCalamity.csproj', 'utf8').match(/<Version>(.*?)<\/Version>/)[1]")
          
          # Notarize App Bundle first if requested
          if [ "${{ inputs.skip_notarize }}" != "true" ]; then
            echo "Starting Notarization for App Bundle..."
            COPYFILE_DISABLE=1 ditto -c -k --keepParent "Release/mac-arm64/XIVTheCalamity.app" "Release/temp-notarize.zip"
            
            xcrun notarytool submit "Release/temp-notarize.zip" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
              
            xcrun stapler staple "Release/mac-arm64/XIVTheCalamity.app"
            rm "Release/temp-notarize.zip"
          fi
          
          # Build DMG
          DMG_PATH="Release/XIVTheCalamity-${VERSION}-mac-arm64.dmg"
          hdiutil create -fs HFS+ -srcfolder "Release/mac-arm64/XIVTheCalamity.app" -volname "XIVTheCalamity" "$DMG_PATH"
          
          # Codesign DMG
          IDENTITY="${{ env.CSC_NAME }}"
          if [ -n "$IDENTITY" ]; then
            echo "Signing DMG..."
            codesign --force --sign "Developer ID Application: $IDENTITY" "$DMG_PATH"
          fi

          # Also package a ZIP of the notarized/stapled App Bundle for silent update
          ZIP_PATH="Release/XIVTheCalamity-${VERSION}-mac-arm64.zip"
          xattr -cr "Release/mac-arm64/XIVTheCalamity.app"
          COPYFILE_DISABLE=1 ditto -c -k --keepParent "Release/mac-arm64/XIVTheCalamity.app" "$ZIP_PATH"

      # Upload macOS artifact
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: |
            Release/XIVTheCalamity-*-mac-arm64.dmg
            Release/XIVTheCalamity-*-mac-arm64.zip

  # ==================== Linux ====================
  build-linux:
    needs: check-branch
    if: needs.check-branch.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build:renderer
          mkdir -p ../backend/src/XIVTheCalamity/wwwroot
          cp -R dist/* ../backend/src/XIVTheCalamity/wwwroot/

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity/XIVTheCalamity.csproj \
            -c Release -r linux-x64 --self-contained true /p:PublishAot=true \
            -o ../Release/linux-out

      # Install appimagetool
      - name: Install appimagetool
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # Package AppDir
      - name: Package AppDir
        run: |
          APPDIR="Release/linux-x64/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/resources"
          
          cp Release/linux-out/XIVTheCalamity "$APPDIR/usr/bin/XIVTheCalamity"
          cp -R shared/resources/ "$APPDIR/usr/share/resources/"
          
          # Copy icon
          cp frontend/build/icons/256x256.png "$APPDIR/XIVTheCalamity.png"
          
          # Dynamically create desktop entry
          cat << 'EOF' > "$APPDIR/XIVTheCalamity.desktop"
          [Desktop Entry]
          Type=Application
          Name=XIVTheCalamity
          Comment=Cross-platform FFXIV Launcher
          Exec=XIVTheCalamity %U
          Icon=XIVTheCalamity
          Categories=Game;
          EOF
          
          cat << 'EOF' > "$APPDIR/AppRun"
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          export PATH="${HERE}/usr/bin:${PATH}"
          exec XIVTheCalamity "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      # Build AppImage
      - name: Build AppImage
        run: |
          VERSION=$(node -p "require('fs').readFileSync('backend/src/XIVTheCalamity/XIVTheCalamity.csproj', 'utf8').match(/<Version>(.*?)<\/Version>/)[1]")
          export ARCH=x86_64
          appimagetool Release/linux-x64/AppDir Release/XIVTheCalamity-${VERSION}-linux-x64.AppImage

      # Upload Linux artifact
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: Release/XIVTheCalamity-*-linux-x64.AppImage

  # ==================== Windows ====================
  build-windows:
    needs: check-branch
    if: needs.check-branch.outputs.should_run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build frontend
      - name: Build frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build:renderer
          New-Item -ItemType Directory -Force -Path "../backend/src/XIVTheCalamity/wwwroot"
          Copy-Item -Path "dist/*" -Destination "../backend/src/XIVTheCalamity/wwwroot" -Recurse -Force

      # Build backend (NativeAOT)
      - name: Build backend
        shell: pwsh
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity/XIVTheCalamity.csproj `
            -c Release -r win-x64 --self-contained true /p:PublishAot=true `
            -o ../Release/win-out
          Remove-Item -Path "../Release/win-out/*.pdb" -ErrorAction SilentlyContinue

      # Package zip
      - name: Package zip
        shell: pwsh
        run: |
          $version = node -e "console.log(require('fs').readFileSync('backend/src/XIVTheCalamity/XIVTheCalamity.csproj', 'utf8').match(/<Version>(.*?)<\/Version>/)[1])"
          $packageDir = "Release/XIVTheCalamity"
          New-Item -ItemType Directory -Force -Path $packageDir
          Copy-Item -Path "Release/win-out/*" -Destination $packageDir -Recurse -Force
          Copy-Item -Path "shared/resources" -Destination "$packageDir/resources" -Recurse -Force
          $zipPath = "Release/XIVTheCalamity-$version-win-x64.zip"
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -Force

      # Build Windows Installer (Inno Setup)
      - name: Build Windows Installer
        shell: pwsh
        run: |
          $version = node -e "console.log(require('fs').readFileSync('backend/src/XIVTheCalamity/XIVTheCalamity.csproj', 'utf8').match(/<Version>(.*?)<\/Version>/)[1])"
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress
          }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version scripts/windows-installer.iss
          } else {
            iscc /DAppVersion=$version scripts/windows-installer.iss
          }

      # Upload Windows artifact
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            Release/XIVTheCalamity-*-win-x64.zip
            Release/XIVTheCalamity-*-win-x64-installer.exe

  # ==================== Publish Release ====================
  publish-release:
    needs: [check-branch, build-macos, build-linux, build-windows]
    if: needs.check-branch.outputs.should_run == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: Release/artifacts

      - name: Prepare binaries for upload
        run: |
          mkdir -p Release/binaries
          find Release/artifacts/ -type f -exec cp {} Release/binaries/ \;
          ls -R Release/binaries/

      - name: Generate legacy update metadata (yml)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          
          # Windows metadata (installer exe)
          WIN_EXE=$(ls -1 Release/binaries/XIVTheCalamity-*-win-x64-installer.exe 2>/dev/null | tail -1)
          if [ -n "$WIN_EXE" ] && [ -f "$WIN_EXE" ]; then
            WIN_EXE_NAME=$(basename "$WIN_EXE")
            WIN_SHA=$(sha512sum "$WIN_EXE" | cut -d' ' -f1)
            WIN_SIZE=$(wc -c < "$WIN_EXE" | tr -d ' ')
            
            cat <<EOF > Release/binaries/latest.yml
          version: ${VERSION}
          files:
            - url: ${WIN_EXE_NAME}
              sha512: ${WIN_SHA}
              size: ${WIN_SIZE}
          path: ${WIN_EXE_NAME}
          sha512: ${WIN_SHA}
          releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          fi
          
          # macOS metadata (zip for auto-update)
          MAC_ZIP=$(ls -1 Release/binaries/XIVTheCalamity-*-mac-arm64.zip 2>/dev/null | tail -1)
          if [ -n "$MAC_ZIP" ] && [ -f "$MAC_ZIP" ]; then
            MAC_ZIP_NAME=$(basename "$MAC_ZIP")
            MAC_SHA=$(sha512sum "$MAC_ZIP" | cut -d' ' -f1)
            MAC_SIZE=$(wc -c < "$MAC_ZIP" | tr -d ' ')
            
            cat <<EOF > Release/binaries/latest-mac.yml
          version: ${VERSION}
          files:
            - url: ${MAC_ZIP_NAME}
              sha512: ${MAC_SHA}
              size: ${MAC_SIZE}
          path: ${MAC_ZIP_NAME}
          sha512: ${MAC_SHA}
          releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          fi
          
          # Linux metadata
          LINUX_APPIMAGE=$(ls -1 Release/binaries/XIVTheCalamity-*-linux-x64.AppImage 2>/dev/null | tail -1)
          if [ -n "$LINUX_APPIMAGE" ] && [ -f "$LINUX_APPIMAGE" ]; then
            LINUX_NAME=$(basename "$LINUX_APPIMAGE")
            LINUX_SHA=$(sha512sum "$LINUX_APPIMAGE" | cut -d' ' -f1)
            LINUX_SIZE=$(wc -c < "$LINUX_APPIMAGE" | tr -d ' ')
            
            cat <<EOF > Release/binaries/latest-linux.yml
          version: ${VERSION}
          files:
            - url: ${LINUX_NAME}
              sha512: ${LINUX_SHA}
              size: ${LINUX_SIZE}
          path: ${LINUX_NAME}
          sha512: ${LINUX_SHA}
          releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          fi
          
          ls -R Release/binaries/

      - name: Publish release with download guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Publishing release for tag: $TAG"
          
          RELEASE_NOTES=""
          if [ -f "RELEASE_NOTES.md" ]; then
            RELEASE_NOTES=$(awk -v tag="## ${TAG}" 'BEGIN{f=0} $0==tag{f=1;next} f && /^## v/{exit} f{print}' RELEASE_NOTES.md)
            RELEASE_NOTES=$(echo "$RELEASE_NOTES" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba;}')
          fi
          
          GENERATE_BODY=""
          PREVIOUS_TAG=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG" ]; then
            GENERATE_BODY=$(gh api repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi
          if [ -z "$GENERATE_BODY" ]; then
            GENERATE_BODY=$(gh api repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi
          
          GUIDE=$(cat << 'GUIDE_EOF'
          
          ## 📥 下載指南 / Download Guide
          
          | 平台 Platform | 檔案 File | 說明 Description |
          |---|---|---|
          | **macOS** (Apple Silicon) | `XIVTheCalamity-VERSION-mac-arm64.dmg` | 安裝檔，雙擊後將 `XIVTheCalamity.app` 拖曳至 Applications 即可使用 |
          | **Linux** (x64) | `XIVTheCalamity-VERSION-linux-x64.AppImage` | 執行前需加上執行權限：`chmod +x *.AppImage`</br> 如果在Steam App中使用或是透過Game Mode執行，需額外加上 `--no-sandbox` 執行參數 |
          | **Windows** (x64) Installer | `XIVTheCalamity-VERSION-win-x64-installer.exe` | 安裝檔，雙擊執行即可安裝 |
          | **Windows** (x64) Portable | `XIVTheCalamity-VERSION-win-x64.zip` | 免安裝壓縮檔，解壓後執行 `XIVTheCalamity.exe` 即可 |
          
          > ⚠️ 以下檔案為自動更新系統使用，一般使用者請勿下載：
          > - `*.yml` — 自動更新元資料（`latest-mac.yml`、`latest-linux.yml`、`latest.yml`）
          
          ---
          
          ## 📂 資料路徑 / Data Paths
          
          啟動器資料存放於各平台的 `AppData` 目錄的 `XIVTheCalamity` 子目錄下，
          遊戲設定檔（FFXIV.cfg 等）位於其中的 `ffxivConfig/` 子目錄中。
          
          | 平台 Platform | AppData 路徑 |
          |---|---|
          | **macOS** | `~/Library/Application Support/` |
          | **Linux** | `~/.config/` |
          | **Windows** | `%APPDATA%\` |
          GUIDE_EOF
          )
          GUIDE="${GUIDE//VERSION/$VERSION}"
          
          FULL_BODY=""
          SEP=$'\n---\n'
          if [ -n "$RELEASE_NOTES" ]; then
            FULL_BODY="${RELEASE_NOTES}${SEP}"
          fi
          if [ -n "$GENERATE_BODY" ]; then
            FULL_BODY="${FULL_BODY}${GENERATE_BODY}${SEP}"
          fi
          FULL_BODY="${FULL_BODY}${GUIDE}"
          
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$FULL_BODY" --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" Release/binaries/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" Release/binaries/* --title "$VERSION" --notes "$FULL_BODY" --repo "$GITHUB_REPOSITORY"
          fi
