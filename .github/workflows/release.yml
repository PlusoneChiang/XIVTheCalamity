name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarize:
        description: 'Skip macOS notarization'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==================== macOS ====================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build XTCAudioRouter
      - name: Build XTCAudioRouter
        run: |
          cd XTCAudioRouter
          ./build.sh release

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity.Api.NativeAOT/XIVTheCalamity.Api.NativeAOT.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -o ../Release/temp-backend

      # Import signing certificate
      - name: Import certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$CERT_PATH"
          
          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          
          # Extract signing identity name for afterPack/afterSign hooks
          # electron-builder requires name WITHOUT "Developer ID Application:" prefix
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"Developer ID Application: \(.*\)".*/\1/')
          echo "CSC_NAME=$IDENTITY" >> $GITHUB_ENV
          echo "Signing identity: $IDENTITY"

      # Prepare Apple API Key for notarization
      - name: Prepare notarization key
        if: ${{ !inputs.skip_notarize }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV

      # Use .icns on CI (actool for .icon requires Xcode 26+)
      - name: Use icns icon for CI
        working-directory: frontend
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build.mac.icon = 'build/XIVTC.icns';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Package and publish to GitHub Release
      - name: Package and publish
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE: ${{ inputs.skip_notarize && '0' || '1' }}
        run: |
          npm ci
          npx electron-builder --mac --arm64 --publish always

      # Notarize
      - name: Notarize app
        if: ${{ !inputs.skip_notarize }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP_PATH="Release/mac-arm64/XIVTheCalamity.app"
          ZIP_PATH="Release/XIVTheCalamity-mac-arm64.zip"
          
          # Clean extended attributes and create zip
          xattr -cr "$APP_PATH"
          COPYFILE_DISABLE=1 ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          
          # Submit for notarization
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          
          # Staple
          xcrun stapler staple "$APP_PATH"
          
          # Staple DMG if exists
          DMG_PATH=$(ls -1 Release/XIVTheCalamity-*-darwin-arm64.dmg 2>/dev/null | tail -1) || true
          if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
            xcrun stapler staple "$DMG_PATH"
          fi

  # ==================== Linux ====================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity.Api.NativeAOT/XIVTheCalamity.Api.NativeAOT.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o ../Release/temp-backend-linux

      # Package and publish
      - name: Package and publish
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --linux --x64 --publish always

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity.Api.NativeAOT/XIVTheCalamity.Api.NativeAOT.csproj `
            -c Release -r win-x64 --self-contained true `
            -o ../Release/temp-backend-windows `
            /p:PublishTrimmed=true /p:PublishSingleFile=true

      # Package and publish
      - name: Package and publish
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          
          # Create Windows-specific electron-builder config
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build.extraResources = [
            { from: '../Release/temp-backend-windows', to: 'backend', filter: ['**/*'] },
            { from: '../shared/resources', to: 'resources', filter: ['**/*'] }
          ];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          
          npx electron-builder --win --x64 --publish always

  # ==================== Publish Release ====================
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release with download guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Publishing release for tag: $TAG"
          
          # Append download guide to existing release notes
          GUIDE=$(cat << 'GUIDE_EOF'
          
          ---
          
          ## 📥 下載指南 / Download Guide
          
          | 平台 Platform | 檔案 File | 說明 Description |
          |---|---|---|
          | **macOS** (Apple Silicon) | `XIVTheCalamity-VERSION-darwin-arm64.dmg` | 安裝檔，拖曳至 Applications 即可使用 |
          | **Linux** (x64) | `XIVTheCalamity-VERSION-linux-x64.AppImage` | 執行前需加上執行權限：`chmod +x *.AppImage`</br> 如果在Steam App中使用或是透過Game Mode執行，需額外加上 `--no-sandbox` 執行參數 |
          | **Windows** (x64) | `XIVTheCalamity-VERSION-win-x64.exe` | 安裝程式，依提示完成安裝 |
          
          > ⚠️ 以下檔案為自動更新系統使用，**一般使用者請勿下載**：
          > - `*.yml` — 自動更新元資料（`latest-mac.yml`、`latest-linux.yml`、`latest.yml`）
          > - `*.zip` — macOS 自動更新差異包
          > - `*.blockmap` — 差異更新索引檔
          
          ---
          
          ## 📂 資料路徑 / Data Paths
          
          啟動器資料存放於各平台的 `AppData` 目錄的 `XIVTheCalamity` 子目錄下，
          遊戲設定檔（FFXIV.cfg 等）位於其中的 `ffxivConfig/` 子目錄中。
          
          | 平台 Platform | AppData 路徑 |
          |---|---|
          | **macOS** | `~/Library/Application Support/` |
          | **Linux** | `~/.config/` |
          | **Windows** | `%APPDATA%\` |
          GUIDE_EOF
          )
          
          # Replace VERSION placeholder
          GUIDE="${GUIDE//VERSION/$VERSION}"
          
          # Generate release notes via GitHub API
          PREVIOUS_TAG=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          GENERATE_BODY=""
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG" ]; then
            GENERATE_BODY=$(gh api repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi
          if [ -z "$GENERATE_BODY" ]; then
            GENERATE_BODY=$(gh api repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi
          
          FULL_BODY="${GENERATE_BODY}${GUIDE}"
          gh release edit "$TAG" --draft=false --notes "$FULL_BODY" --repo "$GITHUB_REPOSITORY"
