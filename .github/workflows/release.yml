name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarize:
        description: 'Skip macOS notarization'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==================== macOS ====================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build XTCAudioRouter
      - name: Build XTCAudioRouter
        run: |
          cd XTCAudioRouter
          ./build.sh release

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity.Api.NativeAOT/XIVTheCalamity.Api.NativeAOT.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -o ../Release/temp-backend

      # Import signing certificate
      - name: Import certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$CERT_PATH"
          
          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          
          # Extract signing identity name for afterPack/afterSign hooks
          # electron-builder requires name WITHOUT "Developer ID Application:" prefix
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"Developer ID Application: \(.*\)".*/\1/')
          echo "CSC_NAME=$IDENTITY" >> $GITHUB_ENV
          echo "Signing identity: $IDENTITY"

      # Prepare Apple API Key for notarization
      - name: Prepare notarization key
        if: ${{ !inputs.skip_notarize }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV

      # Use .icns on CI (actool for .icon requires Xcode 26+)
      - name: Use icns icon for CI
        working-directory: frontend
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build.mac.icon = 'build/XIVTC.icns';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Package Electron app
      - name: Package app
        working-directory: frontend
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE: ${{ inputs.skip_notarize && '0' || '1' }}
        run: |
          npm ci
          npx electron-builder --mac --arm64

      # Notarize
      - name: Notarize app
        if: ${{ !inputs.skip_notarize }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP_PATH="Release/mac-arm64/XIVTheCalamity.app"
          ZIP_PATH="Release/XIVTheCalamity-mac-arm64.zip"
          
          # Clean extended attributes and create zip
          xattr -cr "$APP_PATH"
          COPYFILE_DISABLE=1 ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          
          # Submit for notarization
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          
          # Staple
          xcrun stapler staple "$APP_PATH"
          
          # Staple DMG if exists
          DMG_PATH=$(ls -1 Release/XIVTheCalamity-*-darwin-arm64.dmg 2>/dev/null | tail -1) || true
          if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
            xcrun stapler staple "$DMG_PATH"
          fi

      # Upload artifacts
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Release/*.dmg
            Release/*-darwin-*.zip
          if-no-files-found: warn

  # ==================== Linux ====================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity.Api.NativeAOT/XIVTheCalamity.Api.NativeAOT.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o ../Release/temp-backend-linux

      # Package AppImage
      - name: Package AppImage
        working-directory: frontend
        run: |
          npm ci
          npx electron-builder --linux --x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Release/*.AppImage

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Build backend (NativeAOT)
      - name: Build backend
        run: |
          cd backend
          dotnet publish src/XIVTheCalamity.Api.NativeAOT/XIVTheCalamity.Api.NativeAOT.csproj `
            -c Release -r win-x64 --self-contained true `
            -o ../Release/temp-backend-windows `
            /p:PublishTrimmed=true /p:PublishSingleFile=true

      # Package NSIS installer
      - name: Package installer
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          
          # Create Windows-specific electron-builder config
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build.extraResources = [
            { from: '../Release/temp-backend-windows', to: 'backend', filter: ['**/*'] },
            { from: '../shared/resources', to: 'resources', filter: ['**/*'] }
          ];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          
          npx electron-builder --win --x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Release/*.exe

  # ==================== Create Release ====================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macos-release/*
            artifacts/linux-release/*
            artifacts/windows-release/*
