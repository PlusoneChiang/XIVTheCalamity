# DXVK configuration file for FFXIV
# See: https://github.com/doitsujin/dxvk/wiki/Configuration

# ===== Color and Gamma Settings =====
# Enables HDR support (may affect color rendering)
# dxgi.enableHDR = False

# Forces the swap chain to use a specific format
# Options: RGBA8_UNORM, RGBA8_SRGB, RGB10A2_UNORM, RGBA16_FLOAT
# RGBA8_SRGB may help with color accuracy and gamma
# dxgi.format = RGBA8_SRGB

# Color space for the swap chain
# Options: SRGB_NONLINEAR, HDR10_ST2084
# dxgi.colorSpace = SRGB_NONLINEAR

# ===== Shadow Rendering Settings =====
# Disables the use of VK_EXT_depth_bias_control (may fix shadow artifacts)
# d3d11.disableDepthBiasControl = True

# Relaxed barriers may affect shadow rendering quality
# d3d11.relaxedBarriers = False

# Ignore graphics barriers (can affect shadow quality)
# d3d11.ignoreGraphicsBarriers = False

# ===== General Quality Settings =====
# Sample rate shading (improves quality, may affect performance)
# d3d11.samplerAnisotropy = 16

# Floating point emulation mode (affects precision)
# Options: Auto, Strict, Fast
# d3d11.floatEmulation = Auto

# Invariant position (may fix shader-related rendering issues)
# d3d11.invariantPosition = True

# Disable specialization constants (may affect rendering)
# d3d11.disableSpecializationCache = False

# ===== Performance vs Quality =====
# Number of compiler threads
# dxvk.numCompilerThreads = 0

# Shader cache size in MiB
# dxvk.stateCacheSize = 128

# ===== Recommended Settings for Shadow Issues =====
# Uncomment the following lines if you experience shadow color issues:

# 1. Force sRGB color space (most common fix for color issues)
dxgi.format = RGBA8_SRGB

# 2. Disable depth bias control (may fix shadow artifacts)
d3d11.disableDepthBiasControl = True

# 3. Use strict float emulation (better precision)
d3d11.floatEmulation = Strict

# 4. Enable invariant position (shader consistency)
d3d11.invariantPosition = True

# ===== Additional Options (uncomment if needed) =====
# For darker shadows, try disabling relaxed barriers
# d3d11.relaxedBarriers = False

# For better shadow quality
# d3d11.samplerAnisotropy = 16
